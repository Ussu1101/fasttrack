<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003430" />
      <stop offset="100%" stop-color="#0F4C47" />
    </linearGradient>
  </defs>
  <!-- FastTrack Pine Squircle -->
  <rect width="32" height="32" rx="7" fill="url(#pineGrad)" />

  <!-- Outer Circadian Orbit Arc (Sage) -->
  <circle
    cx="16"
    cy="16"
    r="11.2"
    fill="none"
    stroke="#74DB9D"
    stroke-width="2.2"
    stroke-dasharray="51 19"
    stroke-linecap="round"
  />

  <!-- Inner Fasting Window Arc (Soft Teal) -->
  <circle
    cx="16"
    cy="16"
    r="7.2"
    fill="none"
    stroke="#99D1CA"
    stroke-width="1.7"
    stroke-dasharray="34 11"
    stroke-linecap="round"
  />

  <!-- Precision Clock Hands (Eating Window Indicator) -->
  <path
    d="M16 10.2V16H19.8"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dawn Amber Circadian Milestone Point -->
  <circle cx="20.2" cy="16" r="1.6" fill="#F59E0B" />
</svg>
